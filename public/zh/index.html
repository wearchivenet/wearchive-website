<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE INNER COSMOS · 内在宇宙</title>
<meta name="description" content="一座缓缓转动的内在宇宙。每一颗星体，都是一扇通往你自己的门。">
<meta name="theme-color" content="#8FB4E8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Jost:wght@300;400;500&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #9DBBE4; color: #FFFFFF;
    font-family: 'Jost', 'Noto Serif SC', sans-serif; overflow: hidden; }
  ::selection { background: #C5A86A; color: #0d1b3e; }

  /* ---------- nav ---------- */
  .nav { position: fixed; inset: 0 0 auto; z-index: 40; display: flex; align-items: center;
    justify-content: space-between; gap: 1.2rem; padding: 1.2rem 4vw;
    background: linear-gradient(rgba(60,80,140,.42), transparent); }
  .nav .logo { font-family: 'Cormorant Garamond', serif; font-weight: 600; letter-spacing: .3em;
    color: #F6EEDC; text-decoration: none; font-size: .98rem; white-space: nowrap;
    text-shadow: 0 1px 12px rgba(8,14,34,.8); }
  .nav .links { display: none; gap: 1.6rem; }
  @media (min-width: 1000px) { .nav .links { display: flex; } }
  .nav .links a { color: rgba(246,238,220,.78); text-decoration: none; font-size: .66rem;
    letter-spacing: .28em; text-transform: uppercase; transition: color .4s;
    text-shadow: 0 1px 10px rgba(8,14,34,.9); }
  .nav .links a:hover { color: #FFDFAF; }
  .nav .book { padding: .6rem 1.5rem; border: 1px solid rgba(246,222,170,.8); color: #FFEFD2;
    text-decoration: none; font-size: .64rem; letter-spacing: .3em; text-transform: uppercase;
    background: rgba(8,14,34,.25); backdrop-filter: blur(4px);
    transition: background .4s, color .4s, box-shadow .4s; white-space: nowrap; }
  .nav .book:hover { background: #E8C89A; color: #14224a; box-shadow: 0 0 34px rgba(246,214,150,.5); }

  /* ---------- video stage ---------- */
  .stage { position: fixed; inset: 0; overflow: hidden; opacity: 0; transition: opacity 1.2s ease; }
  .stage.ready { opacity: 1; }
  .stage video { position: absolute; user-select: none; pointer-events: none; }

  /* ---------- module tags beside each celestial body ---------- */
  .tag { position: fixed; z-index: 30; transform: translate(-50%, 0); text-align: center;
    text-decoration: none; display: block; padding: .3rem .6rem;
    animation: drift 7s ease-in-out infinite;
    transition: filter .4s, opacity .4s; opacity: .92; }
  .tag:nth-child(2n)   { animation-duration: 8.4s; animation-delay: -2.4s; }
  .tag:nth-child(3n)   { animation-duration: 9.6s; animation-delay: -4.1s; }
  @keyframes drift { 0%,100% { margin-top: 0; } 50% { margin-top: -5px; } }
  .tag .en { display: block; font-size: .64rem; letter-spacing: .32em; text-transform: uppercase;
    color: #FFF6E2; text-shadow: 0 1px 3px rgba(30,45,90,.65), 0 0 18px rgba(255,220,170,.55); }
  .tag .zh { display: block; margin-top: .28rem; font-family: 'Noto Serif SC', serif;
    font-size: .6rem; letter-spacing: .5em; padding-left: .5em; color: rgba(255,250,238,.85);
    text-shadow: 0 1px 3px rgba(30,45,90,.6); }
  .tag::before { content: ''; display: block; width: 3px; height: 3px; border-radius: 50%;
    margin: 0 auto .35rem; background: #FFEFC9; box-shadow: 0 0 8px 2px rgba(255,230,180,.8); }
  .tag:hover { opacity: 1; filter: brightness(1.25) drop-shadow(0 0 12px rgba(255,225,175,.9)); }

  @media (prefers-reduced-motion: reduce) { .tag { animation: none !important; } }
</style>
</head>
<body>

<div class="stage" id="stage">
  <video id="base" src="/media/hero.mp4" poster="/images/hero-poster.jpg"
    autoplay muted loop playsinline preload="auto"
    aria-label="缓缓转动的星盘悬浮在春日湖谷上空，太阳、月亮与行星沿轨道环绕"></video>
</div>

<nav class="nav">
  <a class="logo" href="/zh/">THE INNER COSMOS</a>
  <div class="links">
    <a href="/zh/astrology">Astrology</a>
    <a href="/zh/tarot-universe">Tarot</a>
    <a href="/zh/energy">Energy</a>
    <a href="/zh/cosmic-method">Courses</a>
    <a href="/zh/journal">Journal</a>
    <a href="/zh/community">Community</a>
    <a href="/zh/guide">About</a>
  </div>
  <a class="book" href="/zh/begin">Book a Session</a>
</nav>

<!-- one door per celestial body -->
<a class="tag" href="/zh/astrology"     data-cx=".2500" data-cy=".1780" data-dy=".070"><span class="en">Astrology</span><span class="zh">占星 · 你的宇宙蓝图</span></a>
<a class="tag" href="/zh/journal"       data-cx=".4970" data-cy=".0780" data-dy=".052"><span class="en">Journal</span><span class="zh">星际日志</span></a>
<a class="tag" href="/zh/energy"        data-cx=".7160" data-cy=".1430" data-dy=".055"><span class="en">Energy</span><span class="zh">能量疗愈</span></a>
<a class="tag" href="/zh/cosmic-method" data-cx=".8550" data-cy=".4080" data-dy=".075"><span class="en">Courses</span><span class="zh">宇宙学习之路</span></a>
<a class="tag" href="/zh/guide"         data-cx=".7370" data-cy=".7190" data-dy=".072"><span class="en">About</span><span class="zh">关于引路人</span></a>
<a class="tag" href="/zh/community"     data-cx=".1700" data-cy=".6950" data-dy=".052"><span class="en">Community</span><span class="zh">同频社群</span></a>
<a class="tag" href="/zh/tarot-universe" data-cx=".4630" data-cy=".8460" data-dy=".055"><span class="en">Tarot</span><span class="zh">塔罗宇宙</span></a>

<script>
(function () {
  'use strict';
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var stage = document.getElementById('stage');
  var vid = document.getElementById('base');
  var VW = 1920, VH = 1080;                 // intrinsic video size
  var tags = [].slice.call(document.querySelectorAll('.tag'));

  function layout() {
    var vw = innerWidth, vh = innerHeight;
    var s = Math.max(vw / VW, vh / VH);
    var ox = (vw - VW * s) / 2, oy = (vh - VH * s) / 2;
    vid.style.width = (VW * s) + 'px';
    vid.style.height = (VH * s) + 'px';
    vid.style.left = ox + 'px';
    vid.style.top = oy + 'px';
    tags.forEach(function (t) {
      var cx = parseFloat(t.dataset.cx), cy = parseFloat(t.dataset.cy), dy = parseFloat(t.dataset.dy);
      t.style.left = (cx * VW * s + ox) + 'px';
      t.style.top = ((cy + dy) * VH * s + oy) + 'px';
    });
  }

  function ready() { layout(); stage.classList.add('ready'); }

  if (vid.readyState >= 2) ready();
  vid.addEventListener('loadeddata', ready);
  vid.addEventListener('error', ready);      // still show poster + tags
  setTimeout(ready, 2500);                   // safety net
  addEventListener('resize', layout);

  if (reduce) { vid.removeAttribute('autoplay'); vid.pause(); }
  // some browsers need a nudge for muted autoplay
  var p = vid.play && vid.play();
  if (p && p.catch) p.catch(function () {});
})();
</script>
</body>
</html>
