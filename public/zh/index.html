<head>

<style>
  :root {
    --navy: #0B0F1A;
    --panel: #151B2A;
    --gold: #C5A86A;
    --gold-bright: #EAD7B8;
    --beige: #F2E9DB;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--navy); color: var(--beige);
    font-family: 'Jost', 'Noto Serif SC', sans-serif; overflow-x: hidden; }
  ::selection { background: var(--gold); color: var(--navy); }

  #space { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

  /* nav */
  .nav { position: fixed; inset: 0 0 auto; z-index: 40; display: flex; align-items: center;
    justify-content: space-between; gap: 1.2rem; padding: 1.2rem 4vw;
    background: linear-gradient(rgba(11,15,26,.82), transparent); }
  .nav .logo { font-family: 'Cormorant Garamond', serif; font-weight: 600; letter-spacing: .3em;
    color: var(--gold-bright); text-decoration: none; font-size: .98rem; white-space: nowrap; }
  .nav .links { display: none; gap: 1.6rem; }
  @media (min-width: 1000px) { .nav .links { display: flex; } }
  .nav .links a { color: rgba(242,233,219,.62); text-decoration: none; font-size: .66rem;
    letter-spacing: .28em; text-transform: uppercase; transition: color .4s; }
  .nav .links a:hover { color: var(--gold-bright); }
  .nav .book { padding: .6rem 1.5rem; border: 1px solid rgba(197,168,106,.75); color: var(--gold-bright);
    text-decoration: none; font-size: .64rem; letter-spacing: .3em; text-transform: uppercase;
    transition: background .4s, color .4s, box-shadow .4s; white-space: nowrap; }
  .nav .book:hover { background: var(--gold); color: var(--navy); box-shadow: 0 0 34px rgba(197,168,106,.4); }

  /* stage */
  .map { position: relative; z-index: 1; width: 100vw; height: 100vh; height: 100svh; overflow: hidden; }
  #orbits { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #orbits ellipse { fill: none; stroke: rgba(197,168,106,.16); stroke-width: 1; }
  #orbits .faint { stroke: rgba(197,168,106,.08); stroke-dasharray: 2 6; }

  /* central natal chart */
  .core { position: absolute; left: 50%; top: 50%; width: min(66vmin, 660px); aspect-ratio: 1;
    transform: translate(-50%, -50%); z-index: 2; }
  .core::before { content: ''; position: absolute; inset: -30%; border-radius: 50%;
    background: radial-gradient(circle, rgba(197,168,106,.16), rgba(197,168,106,.05) 45%, transparent 65%); }
  .core svg { width: 100%; height: 100%; overflow: visible; animation: spin 300s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* planets */
  .planet { position: absolute; left: 0; top: 0; z-index: 5; cursor: pointer; text-decoration: none;
    color: inherit; outline: none; will-change: transform; }
  .planet .orbwrap { position: relative; width: var(--size); height: var(--size); margin: 0 auto; }
  .planet img.orb { display: block; width: 100%; height: 100%; border-radius: 50%;
    object-fit: cover; filter: saturate(1.12) brightness(1.06) contrast(1.02);
    box-shadow: 0 0 calc(var(--size) * .5) var(--glow), inset 0 0 8px rgba(0,0,0,.4);
    transition: transform .5s; }
  .planet.contain img.orb { object-fit: contain; background: transparent; border-radius: 50%; }
  .planet .halo { position: absolute; inset: -70%; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, var(--glow), transparent 60%); opacity: .55;
    transition: opacity .5s, transform .5s; animation: breathe 6s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .3; transform: scale(.92); } }
  .planet:hover img.orb, .planet:focus-visible img.orb { transform: scale(1.16); }
  .planet:hover .halo, .planet:focus-visible .halo { opacity: 1; transform: scale(1.18); animation-play-state: paused; }
  .planet .tag { position: absolute; left: 50%; top: 100%; transform: translateX(-50%);
    text-align: center; padding-top: .7rem; white-space: nowrap; }
  .planet.tag-top .tag { top: auto; bottom: 100%; padding: 0 0 .7rem; }
  .planet .num { display: block; font-family: 'Cormorant Garamond', serif; font-style: italic;
    color: var(--gold); font-size: .8rem; letter-spacing: .22em; }
  .planet .name { display: block; font-family: 'Cormorant Garamond', 'Noto Serif SC', serif;
    font-size: 1.05rem; letter-spacing: .12em; color: var(--beige); margin-top: .12rem; }
  .planet .zh { display: block; font-size: .64rem; letter-spacing: .3em; color: rgba(242,233,219,.55); margin-top: .22rem; }

  /* hover card */
  .card { position: absolute; z-index: 30; width: 250px; padding: 1.15rem 1.25rem; pointer-events: none;
    background: rgba(21,27,42,.93); border: 1px solid rgba(197,168,106,.4); backdrop-filter: blur(6px);
    opacity: 0; transition: opacity .35s; left: 50%; transform: translateX(-50%); top: calc(100% + 3.6rem); }
  .planet.tag-top .card { top: auto; bottom: calc(100% + 3.6rem); }
  .planet:hover .card, .planet:focus-visible .card { opacity: 1; }
  .card h3 { margin: 0 0 .45rem; font-family: 'Cormorant Garamond', 'Noto Serif SC', serif;
    font-weight: 500; font-size: 1.12rem; color: var(--gold-bright); }
  .card p { margin: 0; font-size: .76rem; line-height: 1.8; color: rgba(242,233,219,.7); white-space: normal; }
  .card .enter { display: inline-block; margin-top: .7rem; font-size: .6rem; letter-spacing: .3em;
    text-transform: uppercase; color: var(--gold); }

  /* hint */
  .hint { position: absolute; z-index: 10; left: 50%; bottom: 3vh; transform: translateX(-50%);
    display: flex; align-items: center; gap: .8rem; font-size: .68rem; letter-spacing: .32em;
    color: rgba(242,233,219,.55); white-space: nowrap; }
  .hint .mouse { width: 16px; height: 26px; border: 1px solid rgba(242,233,219,.45); border-radius: 9px; position: relative; }
  .hint .mouse::after { content: ''; position: absolute; left: 50%; top: 5px; width: 2px; height: 5px;
    margin-left: -1px; background: var(--gold); border-radius: 2px; animation: wheel 2.2s ease-in-out infinite; }
  @keyframes wheel { 50% { transform: translateY(6px); opacity: .3; } }

  /* fly-in overlay */
  .fly { position: fixed; inset: 0; z-index: 90; pointer-events: none; opacity: 0;
    background: radial-gradient(circle at var(--fx, 50%) var(--fy, 50%), var(--ftint, #C5A86A) 0%, rgba(11,15,26,.98) 62%);
    transition: opacity .65s ease; }
  .fly.on { opacity: 1; pointer-events: all; }

  .foot { position: relative; z-index: 1; display: flex; flex-wrap: wrap; gap: 1rem 2.5rem;
    align-items: center; justify-content: space-between; padding: 1.4rem 4vw 2rem;
    border-top: 1px solid rgba(197,168,106,.16); background: rgba(11,15,26,.9); }
  .foot p, .foot a { margin: 0; font-size: .62rem; letter-spacing: .24em; text-transform: uppercase;
    color: rgba(242,233,219,.42); text-decoration: none; }
  .foot a:hover { color: var(--gold-bright); }

  /* mobile: vertical constellation list */
  @media (max-width: 760px), (max-height: 560px) {
    .map { height: auto; min-height: 100svh; padding: 15vh 8vw 8vh; overflow: visible; }
    #orbits { display: none; }
    .core { position: relative; left: auto; top: auto; transform: none; margin: 0 auto 7vh; width: min(72vw, 300px); }
    .planet { position: relative !important; transform: none !important; display: grid;
      grid-template-columns: auto 1fr; gap: 1.1rem; align-items: center; text-align: left;
      padding: 1rem 0; border-bottom: 1px solid rgba(197,168,106,.18); }
    .planet .orbwrap { width: 46px !important; height: 46px !important; margin: 0; }
    .planet .tag { position: static; transform: none; padding: 0; text-align: left; white-space: normal; }
    .planet .card, .hint { display: none; }
  }
</style>

<script>
(function () {
  'use strict';
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var mobile = matchMedia('(max-width: 760px), (max-height: 560px)').matches;

  /* ============ deep space background: stars + nebulae ============ */
  (function () {
    var c = document.getElementById('space'), x = c.getContext('2d');
    var w, h, stars = [], nebs = [];
    function build() {
      w = c.width = innerWidth; h = c.height = innerHeight;
      stars = []; nebs = [];
      var n = Math.min(420, w * h / 5200);
      for (var i = 0; i < n; i++) {
        var bright = Math.random() < .08;
        stars.push({ x: Math.random() * w, y: Math.random() * h,
          r: bright ? 1.2 + Math.random() * 1.4 : .3 + Math.random() * .9,
          p: Math.random() * 6.28, bright: bright,
          hue: Math.random() < .3 ? '234,215,184' : '242,233,219' });
      }
      var tints = ['91,86,140', '197,168,106', '70,90,130', '140,100,140', '197,168,106'];
      for (var j = 0; j < 6; j++) {
        nebs.push({ x: Math.random() * w, y: Math.random() * h,
          r: (0.25 + Math.random() * 0.3) * Math.max(w, h),
          t: tints[j % tints.length], a: .05 + Math.random() * .05 });
      }
    }
    build(); addEventListener('resize', build);
    function frame(t) {
      x.clearRect(0, 0, w, h);
      for (var j = 0; j < nebs.length; j++) {
        var nb = nebs[j];
        var g = x.createRadialGradient(nb.x, nb.y, 0, nb.x, nb.y, nb.r);
        g.addColorStop(0, 'rgba(' + nb.t + ',' + nb.a + ')');
        g.addColorStop(1, 'rgba(' + nb.t + ',0)');
        x.fillStyle = g; x.fillRect(nb.x - nb.r, nb.y - nb.r, nb.r * 2, nb.r * 2);
      }
      for (var i = 0; i < stars.length; i++) {
        var s = stars[i];
        var a = (s.bright ? .55 : .22) + .45 * Math.abs(Math.sin(t * .0004 + s.p));
        x.beginPath(); x.fillStyle = 'rgba(' + s.hue + ',' + a + ')';
        x.arc(s.x, s.y, s.r, 0, 6.28); x.fill();
        if (s.bright) {
          x.strokeStyle = 'rgba(' + s.hue + ',' + a * .35 + ')'; x.lineWidth = .6;
          x.beginPath();
          x.moveTo(s.x - s.r * 4, s.y); x.lineTo(s.x + s.r * 4, s.y);
          x.moveTo(s.x, s.y - s.r * 4); x.lineTo(s.x, s.y + s.r * 4);
          x.stroke();
        }
      }
      if (!reduce) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  })();

  /* ============ the natal chart (astrological default wheel) ============ */
  (function () {
    var NS = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', '-500 -500 1000 1000');
    var VS = '︎'; // force text (non-emoji) presentation
    var ZODIAC = ['♈','♉','♊','♋','♌','♍','♎','♏','♐','♑','♒','♓'];
    // planets in their traditional domiciles (default natural chart)
    var PLANETS = [
      { g: '♂', sign: 0 },  // Mars — Aries
      { g: '♀', sign: 1 },  // Venus — Taurus
      { g: '☿', sign: 2 },  // Mercury — Gemini
      { g: '☽', sign: 3 },  // Moon — Cancer
      { g: '☉', sign: 4 },  // Sun — Leo
      { g: '♇', sign: 7 },  // Pluto — Scorpio
      { g: '♃', sign: 8 },  // Jupiter — Sagittarius
      { g: '♄', sign: 9 },  // Saturn — Capricorn
      { g: '♅', sign: 10 }, // Uranus — Aquarius
      { g: '♆', sign: 11 }  // Neptune — Pisces
    ];
    function pt(r, deg) {
      var a = deg * Math.PI / 180;
      return [r * Math.cos(a), -r * Math.sin(a)];
    }
    function el(name, attrs, text) {
      var e = document.createElementNS(NS, name);
      for (var k in attrs) e.setAttribute(k, attrs[k]);
      if (text) e.textContent = text;
      return e;
    }
    var stroke = '#C5A86A';
    // rings: outer zodiac band, houses band, inner
    [[480, .9, 1.2], [400, .8, 1], [300, .35, .8], [140, .7, 1], [60, .3, .7]].forEach(function (r) {
      svg.appendChild(el('circle', { r: r[0], fill: 'none', stroke: stroke,
        'stroke-opacity': r[1], 'stroke-width': r[2] }));
    });
    // degree ticks on outer band: every 5°, longer every 30°
    for (var d = 0; d < 360; d += 5) {
      var major = d % 30 === 0;
      var p1 = pt(480, d), p2 = pt(major ? 452 : 466, d);
      svg.appendChild(el('line', { x1: p1[0], y1: p1[1], x2: p2[0], y2: p2[1],
        stroke: stroke, 'stroke-opacity': major ? .85 : .4, 'stroke-width': major ? 1.2 : .6 }));
    }
    // house cusps (whole-sign default): 12 spokes, Aries starts at the Ascendant (left, 180°), counterclockwise
    for (var i = 0; i < 12; i++) {
      var ang = 180 + i * 30;
      var q1 = pt(140, ang), q2 = pt(400, ang);
      svg.appendChild(el('line', { x1: q1[0], y1: q1[1], x2: q2[0], y2: q2[1],
        stroke: stroke, 'stroke-opacity': i % 3 === 0 ? .75 : .38, 'stroke-width': i % 3 === 0 ? 1.3 : .7 }));
    }
    // AC / MC axis emphasis
    [[180, 'AC'], [90, 'MC']].forEach(function (ax) {
      var lbl = pt(508, ax[0]);
      svg.appendChild(el('text', { x: lbl[0], y: lbl[1], fill: '#EAD7B8', 'fill-opacity': .8,
        'font-size': 24, 'text-anchor': 'middle', 'dominant-baseline': 'central',
        'font-family': "'Cormorant Garamond', serif", 'letter-spacing': 2 }, ax[1]));
    });
    // zodiac glyphs — counterclockwise from Aries at the ASC
    for (var z = 0; z < 12; z++) {
      var za = 180 + z * 30 + 15;
      var zp = pt(440, za);
      svg.appendChild(el('text', { x: zp[0], y: zp[1], fill: '#EAD7B8', 'fill-opacity': .95,
        'font-size': 42, 'text-anchor': 'middle', 'dominant-baseline': 'central',
        'font-family': "'Noto Serif SC', serif" }, ZODIAC[z] + VS));
    }
    // house numbers (small, inner band)
    var ROMAN = ['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'];
    for (var hnum = 0; hnum < 12; hnum++) {
      var ha = 180 + hnum * 30 + 15;
      var hp = pt(168, ha);
      svg.appendChild(el('text', { x: hp[0], y: hp[1], fill: '#C5A86A', 'fill-opacity': .55,
        'font-size': 24, 'font-style': 'italic', 'text-anchor': 'middle', 'dominant-baseline': 'central',
        'font-family': "'Cormorant Garamond', serif" }, ROMAN[hnum]));
    }
    // planet glyphs in domicile signs + collect positions for aspects
    var ppos = [];
    PLANETS.forEach(function (p) {
      var pa = 180 + p.sign * 30 + 15;
      var pp = pt(350, pa);
      ppos.push(pt(140, pa));
      svg.appendChild(el('circle', { cx: pp[0], cy: pp[1], r: 26, fill: 'rgba(197,168,106,0.07)',
        stroke: stroke, 'stroke-opacity': .3, 'stroke-width': .7 }));
      svg.appendChild(el('text', { x: pp[0], y: pp[1], fill: '#EAD7B8',
        'font-size': 34, 'text-anchor': 'middle', 'dominant-baseline': 'central',
        'font-family': "'Noto Serif SC', serif" }, p.g + VS));
      // degree marker on inner circle
      var mp = pt(140, pa);
      svg.appendChild(el('circle', { cx: mp[0], cy: mp[1], r: 4, fill: '#EAD7B8', 'fill-opacity': .85 }));
    });
    // aspect web between planet degree markers (trines/oppositions of the natural wheel)
    var ASPECTS = [[0,4],[0,6],[3,9],[4,8],[1,7],[2,9],[5,8],[6,9],[4,7],[3,5]];
    ASPECTS.forEach(function (a) {
      var A = ppos[a[0]], B = ppos[a[1]];
      svg.appendChild(el('line', { x1: A[0], y1: A[1], x2: B[0], y2: B[1],
        stroke: stroke, 'stroke-opacity': .3, 'stroke-width': .8 }));
    });
    // center sun-point
    var burst = el('g', {});
    for (var b = 0; b < 8; b++) {
      var bp1 = pt(14, b * 45), bp2 = pt(38, b * 45);
      burst.appendChild(el('line', { x1: bp1[0], y1: bp1[1], x2: bp2[0], y2: bp2[1],
        stroke: '#EAD7B8', 'stroke-opacity': .9, 'stroke-width': 1.4 }));
    }
    svg.appendChild(burst);
    svg.appendChild(el('circle', { r: 9, fill: '#EAD7B8' }));
    document.getElementById('core').appendChild(svg);
  })();

  /* ============ textured module planets on slow orbits ============ */
  /* real NASA imagery (public domain), one celestial body per universe */
  var MODULES = [
    { href: '/zh/astrology', num: '01', name: 'Astrology', zh: '认识你的宇宙蓝图', body: '太阳 · Sun',
      line: '认识你内在宇宙的构造。本命盘、宫位、星座、行星与相位——一场进入自己蓝图的旅程。',
      img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/b/b4/The_Sun_by_the_Atmospheric_Imaging_Assembly_of_NASA%27s_Solar_Dynamics_Observatory_-_20100819.jpg/480px-The_Sun_by_the_Atmospheric_Imaging_Assembly_of_NASA%27s_Solar_Dynamics_Observatory_-_20100819.jpg',
      base: [255,170,90], size: 38, orbit: 2, phase: 68, speed: 1 },
    { href: '/zh/tarot-universe', num: '02', name: 'Tarot', zh: '洞察潜意识的指引', body: '月亮 · Moon',
      line: '牌阵、节气、指引与洞察——让潜意识浮出水面，被温柔地看见。',
      img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/c/c9/Moon_nearside_LRO.jpg/480px-Moon_nearside_LRO.jpg',
      base: [200,215,255], size: 30, orbit: 2, phase: 8, speed: -0.8 },
    { href: '/zh/energy', num: '03', name: 'Energy', zh: '疗愈身心，重启能量', body: '金星 · Venus',
      line: '疗愈、净化、平衡、重启——让身体与能量场回到自然的节奏。',
      img: 'https://upload.wikimedia.org/wikipedia/commons/e/e5/Venus-real_color.jpg',
      base: [240,215,170], size: 28, orbit: 1, phase: -20, speed: 0.9 },
    { href: '/zh/cosmic-method', num: '04', name: 'Courses', zh: '系统学习，实践成长', body: '木星 · Jupiter',
      line: 'COSMIC 六步转化模型——课程、实践与案例，一套可以带走的自我重构方法。',
      img: 'https://upload.wikimedia.org/wikipedia/commons/2/2b/Jupiter_and_its_shrunken_Great_Red_Spot.jpg',
      base: [230,200,160], size: 34, orbit: 2, phase: -70, speed: 0.75 },
    { href: '/zh/journal', num: '05', name: 'Journal', zh: '知识与洞见的宇宙图书馆', body: '水星 · Mercury',
      line: '文章、洞见、心理与星象——持续生长的宇宙图书馆。',
      img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/d/d9/Mercury_in_color_-_Prockter07-edit1.jpg/480px-Mercury_in_color_-_Prockter07-edit1.jpg',
      base: [200,200,215], size: 26, orbit: 1, phase: -130, speed: -0.85 },
    { href: '/zh/community', num: '06', name: 'Community', zh: '在同频中成长与共创', body: '火星 · Mars',
      line: '陪伴、成长、共创与公益——和同频的人一起，走得更远。',
      img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/3/36/Mars_Valles_Marineris_EDIT.jpg/480px-Mars_Valles_Marineris_EDIT.jpg',
      base: [235,150,110], size: 28, orbit: 2, phase: -150, speed: 0.7 },
    { href: '/zh/begin', num: '07', name: 'Consultation', zh: '一对一深度咨询', body: '土星 · Saturn',
      line: '一对一深度咨询——带着你的问题来，我们从这里开始。',
      img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/c/c7/Saturn_during_Equinox.jpg/500px-Saturn_during_Equinox.jpg',
      base: [225,205,160], size: 36, orbit: 1, phase: 150, speed: -0.65, contain: true }
  ];

  var map = document.getElementById('map');
  var planets = [];
  MODULES.forEach(function (m) {
    var a = document.createElement('a');
    a.className = 'planet' + (m.contain ? ' contain' : '');
    a.href = m.href;
    a.style.setProperty('--size', m.size + 'px');
    a.style.setProperty('--glow', 'rgba(' + m.base.join(',') + ',.45)');
    a.innerHTML =
      '<span class="orbwrap"><img class="orb" alt="" loading="lazy" decoding="async" src="' + m.img + '"><span class="halo"></span></span>' +
      '<span class="tag"><span class="num">' + m.num + '</span>' +
      '<span class="name">' + m.name + '</span>' +
      '<span class="zh">' + m.zh + '</span></span>' +
      '<span class="card"><h3>' + m.name + ' · ' + m.zh + '</h3><p>' + m.body + '。' + m.line + '</p>' +
      '<span class="enter">→ Enter</span></span>';
    map.appendChild(a);
    planets.push({ el: a, m: m, angle: m.phase });
  });

  /* orbit rings + motion */
  var orbitsSvg = document.getElementById('orbits');
  function orbitRadii() {
    var vm = Math.min(innerWidth, innerHeight);
    return [
      { rx: Math.min(vm * .58, innerWidth * .34), k: .62 },
      { rx: Math.min(vm * .78, innerWidth * .44), k: .60 }
    ];
  }
  function drawRings() {
    if (mobile) return;
    orbitsSvg.setAttribute('viewBox', '0 0 ' + innerWidth + ' ' + innerHeight);
    orbitsSvg.innerHTML = '';
    var cx = innerWidth / 2, cy = innerHeight / 2;
    var rings = orbitRadii();
    var NS = 'http://www.w3.org/2000/svg';
    rings.concat([{ rx: rings[0].rx * .8, k: .63, faint: true }, { rx: rings[1].rx * 1.14, k: .59, faint: true }])
      .forEach(function (r) {
        var e = document.createElementNS(NS, 'ellipse');
        e.setAttribute('cx', cx); e.setAttribute('cy', cy);
        e.setAttribute('rx', r.rx); e.setAttribute('ry', r.rx * r.k);
        if (r.faint) e.setAttribute('class', 'faint');
        orbitsSvg.appendChild(e);
      });
  }
  drawRings(); addEventListener('resize', drawRings);

  function tick() {
    var cx = innerWidth / 2, cy = innerHeight / 2;
    var rings = orbitRadii();
    planets.forEach(function (p) {
      if (!reduce) p.angle += p.m.speed * 0.0065; // slow orbital drift
      var ring = rings[p.m.orbit - 1];
      var rad = p.angle * Math.PI / 180;
      var x = cx + ring.rx * Math.cos(rad);
      var y = cy + ring.rx * ring.k * Math.sin(rad);
      p.el.style.transform = 'translate(' + (x - p.m.size / 2) + 'px,' + (y - p.m.size / 2) + 'px)';
      p.el.classList.toggle('tag-top', y > cy + ring.rx * ring.k * .45);
    });
    if (!reduce) requestAnimationFrame(tick);
  }
  if (!mobile) { tick(); if (reduce) tick(); }

  /* click fly-in */
  var fly = document.getElementById('fly');
  planets.forEach(function (p) {
    p.el.addEventListener('click', function (e) {
      if (reduce || !fly) return;
      e.preventDefault();
      var r = p.el.querySelector('.orbwrap').getBoundingClientRect();
      fly.style.setProperty('--fx', (r.left + r.width / 2) / innerWidth * 100 + '%');
      fly.style.setProperty('--fy', (r.top + r.height / 2) / innerHeight * 100 + '%');
      fly.style.setProperty('--ftint', 'rgb(' + p.m.base.join(',') + ')');
      fly.classList.add('on');
      setTimeout(function () { location.href = p.m.href; }, 620);
    });
  });
})();
</script>
</body>
</html>
