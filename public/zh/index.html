<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE INNER COSMOS · 内在宇宙</title>
<meta name="description" content="一张会呼吸的星盘。悬浮、苏醒、缓慢转动——进入你的内在宇宙。">
<meta name="theme-color" content="#0d1b3e">
<link rel="preload" as="image" href="/images/celestial-hero-source.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Jost:wght@300;400;500&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0d1b3e; color: #F2E9DB;
    font-family: 'Jost', 'Noto Serif SC', sans-serif; overflow: hidden; }
  ::selection { background: #C5A86A; color: #0d1b3e; }

  /* ---------- nav ---------- */
  .nav { position: fixed; inset: 0 0 auto; z-index: 40; display: flex; align-items: center;
    justify-content: space-between; gap: 1.2rem; padding: 1.2rem 4vw;
    background: linear-gradient(rgba(8,14,34,.62), transparent); }
  .nav .logo { font-family: 'Cormorant Garamond', serif; font-weight: 600; letter-spacing: .3em;
    color: #F6EEDC; text-decoration: none; font-size: .98rem; white-space: nowrap;
    text-shadow: 0 1px 12px rgba(8,14,34,.8); }
  .nav .links { display: none; gap: 1.6rem; }
  @media (min-width: 1000px) { .nav .links { display: flex; } }
  .nav .links a { color: rgba(246,238,220,.78); text-decoration: none; font-size: .66rem;
    letter-spacing: .28em; text-transform: uppercase; transition: color .4s;
    text-shadow: 0 1px 10px rgba(8,14,34,.9); }
  .nav .links a:hover { color: #FFDFAF; }
  .nav .book { padding: .6rem 1.5rem; border: 1px solid rgba(246,222,170,.8); color: #FFEFD2;
    text-decoration: none; font-size: .64rem; letter-spacing: .3em; text-transform: uppercase;
    background: rgba(8,14,34,.25); backdrop-filter: blur(4px);
    transition: background .4s, color .4s, box-shadow .4s; white-space: nowrap; }
  .nav .book:hover { background: #E8C89A; color: #14224a; box-shadow: 0 0 34px rgba(246,214,150,.5); }

  /* ---------- hero stage ---------- */
  .stage { position: fixed; inset: 0; overflow: hidden; }
  .stage > img.base { position: absolute; will-change: transform; user-select: none; -webkit-user-drag: none; }

  /* everything registered over the image is absolutely positioned by JS */
  .layer { position: absolute; will-change: transform; }

  /* chart wrapper: floating + tremor live here (GPU transforms only) */
  .chart-wrap { animation: floaty 7s ease-in-out infinite; }
  .chart-wrap.waking { animation: floaty 7s ease-in-out infinite, tremor .42s cubic-bezier(.36,.07,.19,.97); }
  @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  @keyframes tremor {
    10%, 90% { translate: -1px 0; rotate: -.18deg; }
    20%, 80% { translate: 1.2px 0; rotate: .22deg; }
    30%, 50%, 70% { translate: -1.6px 0; rotate: -.3deg; }
    40%, 60% { translate: 1.6px 0; rotate: .3deg; }
  }
  .chart-wrap canvas { display: block; width: 100%; height: 100%; }

  /* breathing bloom behind / around the chart */
  .bloom { border-radius: 50%; pointer-events: none;
    background: radial-gradient(50% 50% at 50% 50%,
      rgba(255,196,150,.34) 0%, rgba(255,170,140,.16) 42%, rgba(255,150,130,.05) 62%, transparent 74%);
    mix-blend-mode: screen;
    animation: breathe 5.2s ease-in-out infinite; }
  .bloom.b2 { animation-duration: 6.4s; animation-delay: -2.1s; opacity: .7; }
  .armed .bloom { animation-duration: 3.6s; }
  @keyframes breathe {
    0%, 100% { opacity: .45; transform: scale(.95); }
    50% { opacity: 1; transform: scale(1.07); }
  }

  /* planets: static feathered crops, self-rotation */
  .planet-layer { pointer-events: none; }
  .planet-layer canvas { display: block; width: 100%; height: 100%;
    animation: spin var(--dur, 160s) linear infinite; animation-direction: var(--dir, normal); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .planet-layer.bob { animation: bob var(--bobdur, 9s) ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

  /* hint */
  .hint { position: fixed; z-index: 30; left: 50%; bottom: 3vh; transform: translateX(-50%);
    display: flex; align-items: center; gap: .8rem; font-size: .66rem; letter-spacing: .34em;
    color: rgba(246,238,220,.75); white-space: nowrap; text-shadow: 0 1px 10px rgba(8,14,34,.9); }
  .hint .mouse { width: 16px; height: 26px; border: 1px solid rgba(246,238,220,.6); border-radius: 9px; position: relative; }
  .hint .mouse::after { content: ''; position: absolute; left: 50%; top: 5px; width: 2px; height: 5px;
    margin-left: -1px; background: #F6DEAA; border-radius: 2px; animation: wheel 2.2s ease-in-out infinite; }
  @keyframes wheel { 50% { transform: translateY(6px); opacity: .3; } }

  /* fade-in once ready */
  .stage { opacity: 0; transition: opacity 1.2s ease; }
  .stage.ready { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .chart-wrap, .bloom, .planet-layer canvas, .planet-layer.bob, .hint .mouse::after { animation: none !important; }
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <img class="base" id="base" src="/images/celestial-hero-source.png" alt="悬浮在云海之上的发光星盘，四周环绕着太阳、月亮与行星">
</div>

<nav class="nav">
  <a class="logo" href="/zh/">THE INNER COSMOS</a>
  <div class="links">
    <a href="/zh/astrology">Astrology</a>
    <a href="/zh/tarot-universe">Tarot</a>
    <a href="/zh/energy">Energy</a>
    <a href="/zh/cosmic-method">Courses</a>
    <a href="/zh/journal">Journal</a>
    <a href="/zh/community">Community</a>
    <a href="/zh/guide">About</a>
  </div>
  <a class="book" href="/zh/begin">Book a Session</a>
</nav>

<div class="hint"><span class="mouse"></span>触碰星盘，唤醒你的宇宙</div>

<script>
(function () {
  'use strict';
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var DEBUG = /[?&]debug=1/.test(location.search);

  /* ============================================================
     All coordinates are fractions of the source image
     (x, r → of width; y → of height). Calibrated to
     celestial-hero-source.png.
     ============================================================ */
  var CHART = { cx: .511, cy: .548, rx: .327, ry: .3032 };
  var SATURN = { cx: .758, cy: .858, rx: .082, ry: .058, dur: 180 };
  var PLANETS = [
    { id: 'sun',   cx: .209, cy: .222, r: .058, dur: 220, dir: 1,  bob: 11 }, // 太阳 · 最慢
    { id: 'moonT', cx: .469, cy: .153, r: .037, dur: 130, dir: -1, bob: 9  }, // 月亮 · 略快
    { id: 'jupS',  cx: .732, cy: .180, r: .032, dur: 170, dir: 1,  bob: 10 }, // 木星(小) · 慢
    { id: 'jupB',  cx: .901, cy: .626, r: .048, dur: 160, dir: -1, bob: 12 }, // 木星(大) · 慢
    { id: 'mars',  cx: .176, cy: .847, r: .042, dur: 90,  dir: 1,  bob: 8  }, // 火星 · 偏快
    { id: 'moonB', cx: .468, cy: .903, r: .035, dur: 115, dir: -1, bob: 9  }  // 月亮 · 略快
  ];

  var stage = document.getElementById('stage');
  var base = document.getElementById('base');
  var iw, ih;                    // intrinsic image size
  var layers = [];               // {el, cx, cy, rx, ry} in image fractions
  var chart = {};                // runtime chart state
  var saturn = {};

  /* ---------- cover-fit math ---------- */
  function coverMetrics() {
    var vw = innerWidth, vh = innerHeight;
    var s = Math.max(vw / iw, vh / ih);
    return { s: s, ox: (vw - iw * s) / 2, oy: (vh - ih * s) / 2 };
  }

  function place(el, cxf, cyf, rxf, ryf, m) {
    var cx = cxf * iw * m.s + m.ox;
    var cy = cyf * ih * m.s + m.oy;
    var rx = rxf * iw * m.s;
    var ry = (ryf || rxf) * iw * m.s;
    if (ryf) ry = ryf * ih * m.s;
    el.style.left = (cx - rx) + 'px';
    el.style.top = (cy - ry) + 'px';
    el.style.width = (rx * 2) + 'px';
    el.style.height = (ry * 2) + 'px';
    return { cx: cx, cy: cy, rx: rx, ry: ry };
  }

  /* ---------- feathered crop helpers ---------- */
  function featherCircle(ctx, D, inner) {
    ctx.globalCompositeOperation = 'destination-in';
    var g = ctx.createRadialGradient(D/2, D/2, 0, D/2, D/2, D/2);
    g.addColorStop(0, 'rgba(0,0,0,1)');
    g.addColorStop(inner, 'rgba(0,0,0,1)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, D, D);
    ctx.globalCompositeOperation = 'source-over';
  }

  /* circular planet crop, drawn once */
  function buildPlanet(p, m) {
    var wrap = document.createElement('div');
    wrap.className = 'layer planet-layer bob';
    wrap.style.setProperty('--bobdur', p.bob + 's');
    var cv = document.createElement('canvas');
    cv.style.setProperty('--dur', p.dur + 's');
    if (p.dir < 0) cv.style.setProperty('--dir', 'reverse');
    wrap.appendChild(cv);
    stage.appendChild(wrap);
    if (DEBUG) wrap.style.outline = '1px solid red';
    layers.push({ el: wrap, p: p, cv: cv, kind: 'planet' });
    paintPlanet(cv, p, m);
    place(wrap, p.cx, p.cy, p.r, null, m);
  }

  function paintPlanet(cv, p, m) {
    var rPix = p.r * iw * m.s;
    var D = Math.min(512, Math.ceil(rPix * 2 * Math.min(devicePixelRatio || 1, 2)));
    cv.width = cv.height = D;
    var ctx = cv.getContext('2d');
    var sr = p.r * iw;                       // source radius in image px
    ctx.drawImage(base, (p.cx * iw) - sr, (p.cy * ih) - sr, sr * 2, sr * 2, 0, 0, D, D);
    featherCircle(ctx, D, .72);
  }

  /* ============================================================
     the chart: an ellipse in perspective, rotated in its own
     plane via the conjugate transform  E · R(θ) · E⁻¹
     ============================================================ */
  function buildChart(m) {
    var wrap = document.createElement('div');
    wrap.className = 'layer chart-wrap';
    wrap.id = 'chartWrap';
    var cv = document.createElement('canvas');
    wrap.appendChild(cv);
    stage.appendChild(wrap);

    // two breathing blooms slightly larger than the chart
    ['b1', 'b2'].forEach(function (cls) {
      var b = document.createElement('div');
      b.className = 'layer bloom ' + cls;
      stage.insertBefore(b, wrap);
      layers.push({ el: b, kind: 'bloom' });
    });

    if (DEBUG) wrap.style.outline = '1px solid lime';
    layers.push({ el: wrap, kind: 'chart', cv: cv });

    chart = {
      wrap: wrap, cv: cv,
      angle: 0,
      vel: 0,
      idle: reduce ? 0 : (2 * Math.PI) / 260,   // rad per second · standby
      active: (2 * Math.PI) / 85,               // rad per second · awakened (~85s/圈)
      target: 0,
      armedOnce: false
    };
    chart.target = chart.idle;
    rebuildChartTex(m);

    // pointer interaction (elliptical hit area via border-radius)
    wrap.style.borderRadius = '50%';
    wrap.style.cursor = 'pointer';
    wrap.addEventListener('mouseenter', function () {
      if (reduce) return;
      wrap.classList.add('waking');
      stage.classList.add('armed');
      setTimeout(function () { wrap.classList.remove('waking'); }, 460);
      chart.target = chart.active;
    });
    wrap.addEventListener('mouseleave', function () {
      chart.target = chart.idle;          // smooth deceleration handled in tick
      stage.classList.remove('armed');
    });
  }

  function rebuildChartTex(m) {
    var rxPix = CHART.rx * iw * m.s;
    var ryPix = CHART.ry * ih * m.s;
    chart.k = ryPix / rxPix;
    var D = Math.min(1600, Math.ceil(rxPix * 2 * Math.min(devicePixelRatio || 1, 1.6)));
    // unprojected texture: stretch the ellipse crop into a circle
    var tex = document.createElement('canvas');
    tex.width = tex.height = D;
    var tctx = tex.getContext('2d');
    var srx = CHART.rx * iw, sry = CHART.ry * ih;
    tctx.drawImage(base, CHART.cx * iw - srx, CHART.cy * ih - sry, srx * 2, sry * 2, 0, 0, D, D);
    featherCircle(tctx, D, .90);
    chart.tex = tex;
    chart.D = D;
    // display canvas matches the on-screen ellipse
    chart.cv.width = Math.ceil(rxPix * 2 * Math.min(devicePixelRatio || 1, 1.6));
    chart.cv.height = Math.ceil(ryPix * 2 * Math.min(devicePixelRatio || 1, 1.6));
  }

  function drawChart() {
    var cv = chart.cv, ctx = cv.getContext('2d');
    var w = cv.width, h = cv.height;
    ctx.clearRect(0, 0, w, h);
    ctx.save();
    ctx.translate(w / 2, h / 2);
    ctx.scale(1, chart.k);                       // project back to the tilted plane
    ctx.rotate(chart.angle);                     // spin the disc
    var R = w / 2;
    ctx.drawImage(chart.tex, -R, -R, R * 2, R * 2);
    ctx.restore();
  }

  /* ---------- saturn: ring-plane rotation, same technique ---------- */
  function buildSaturn(m) {
    var wrap = document.createElement('div');
    wrap.className = 'layer planet-layer bob';
    wrap.style.setProperty('--bobdur', '10s');
    var cv = document.createElement('canvas');
    wrap.appendChild(cv);
    stage.appendChild(wrap);
    if (DEBUG) wrap.style.outline = '1px solid cyan';
    layers.push({ el: wrap, kind: 'saturn', cv: cv });
    saturn = { cv: cv, angle: 0 };
    rebuildSaturnTex(m);
  }

  function rebuildSaturnTex(m) {
    var rxPix = SATURN.rx * iw * m.s;
    var ryPix = SATURN.ry * ih * m.s;
    saturn.k = ryPix / rxPix;
    var D = Math.min(512, Math.ceil(rxPix * 2 * Math.min(devicePixelRatio || 1, 2)));
    var tex = document.createElement('canvas');
    tex.width = tex.height = D;
    var tctx = tex.getContext('2d');
    var srx = SATURN.rx * iw, sry = SATURN.ry * ih;
    tctx.drawImage(base, SATURN.cx * iw - srx, SATURN.cy * ih - sry, srx * 2, sry * 2, 0, 0, D, D);
    featherCircle(tctx, D, .78);
    saturn.tex = tex;
    saturn.cv.width = D;
    saturn.cv.height = Math.ceil(D * saturn.k);
  }

  function drawSaturn() {
    var cv = saturn.cv, ctx = cv.getContext('2d');
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.save();
    ctx.translate(cv.width / 2, cv.height / 2);
    ctx.scale(1, saturn.k);
    ctx.rotate(saturn.angle);
    var R = cv.width / 2;
    ctx.drawImage(saturn.tex, -R, -R, R * 2, R * 2);
    ctx.restore();
  }

  /* ---------- layout everything ---------- */
  function layout() {
    var m = coverMetrics();
    base.style.width = (iw * m.s) + 'px';
    base.style.height = (ih * m.s) + 'px';
    base.style.left = m.ox + 'px';
    base.style.top = m.oy + 'px';
    base.style.position = 'absolute';

    layers.forEach(function (L) {
      if (L.kind === 'planet') {
        place(L.el, L.p.cx, L.p.cy, L.p.r, null, m);
        paintPlanet(L.cv, L.p, m);
      } else if (L.kind === 'chart') {
        place(L.el, CHART.cx, CHART.cy, CHART.rx, CHART.ry, m);
        rebuildChartTex(m);
      } else if (L.kind === 'bloom') {
        place(L.el, CHART.cx, CHART.cy, CHART.rx * 1.22, CHART.ry * 1.30, m);
      } else if (L.kind === 'saturn') {
        place(L.el, SATURN.cx, SATURN.cy, SATURN.rx, SATURN.ry, m);
        rebuildSaturnTex(m);
      }
    });
  }

  /* ---------- animation loop: smooth ease between speeds ---------- */
  var last = 0;
  function tick(t) {
    var dt = Math.min(.05, (t - last) / 1000) || 0;
    last = t;
    // ease angular velocity toward target — gives soft start & soft stop
    chart.vel += (chart.target - chart.vel) * Math.min(1, dt * 1.6);
    chart.angle += chart.vel * dt;
    drawChart();
    if (!reduce) {
      saturn.angle += ((2 * Math.PI) / SATURN.dur) * dt;
      drawSaturn();
    }
    requestAnimationFrame(tick);
  }

  /* ---------- boot ---------- */
  function boot() {
    iw = base.naturalWidth; ih = base.naturalHeight;
    var m = coverMetrics();
    buildChart(m);
    PLANETS.forEach(function (p) { buildPlanet(p, m); });
    buildSaturn(m);
    layout();
    stage.classList.add('ready');
    if (reduce) { drawChart(); drawSaturn(); return; }
    requestAnimationFrame(function (t) { last = t; requestAnimationFrame(tick); });
  }

  if (base.complete && base.naturalWidth) boot();
  else base.addEventListener('load', boot);
  addEventListener('resize', layout);
})();
</script>
</body>
</html>
