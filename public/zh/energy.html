<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<style>
  :root { --navy:#0B0F1A; --gold:#C5A86A; --beige:#F2E9DB; --tint:#A7B79A; --tintLight:#E2EBD8; }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; background:var(--navy); color:var(--beige);
    font-family:'Jost','Noto Serif SC',sans-serif; }
  ::selection { background:var(--tint); color:var(--navy); }
  #sky { position:fixed; inset:0; z-index:0; pointer-events:none; }
  .glow { position:fixed; width:70vmax; height:55vmax; left:50%; top:55%; transform:translate(-50%,-50%);
    background:radial-gradient(circle, color-mix(in srgb, var(--tint) 14%, transparent), transparent 65%);
    filter:blur(60px); z-index:0; pointer-events:none; }
  .nav { position:fixed; inset:0 0 auto; z-index:40; display:flex; align-items:center;
    justify-content:space-between; padding:1.15rem 4vw;
    background:linear-gradient(rgba(11,15,26,.85), transparent); }
  .nav a { text-decoration:none; }
  .nav .logo { font-family:'Cormorant Garamond',serif; font-weight:600; letter-spacing:.3em;
    color:#EAD7B8; font-size:.9rem; }
  .nav .book { padding:.5rem 1.2rem; border:1px solid rgba(197,168,106,.7); color:#EAD7B8;
    font-size:.62rem; letter-spacing:.26em; text-transform:uppercase; transition:all .4s; }
  .nav .book:hover { background:var(--gold); color:var(--navy); }
  main { position:relative; z-index:1; min-height:100svh; display:grid; place-content:center;
    text-align:center; padding:0 8vw; }
  .num { font-family:'Cormorant Garamond',serif; font-style:italic; color:var(--tint);
    letter-spacing:.3em; font-size:1rem; margin:0 0 1.2rem; }
  h1 { margin:0; font-family:'Cormorant Garamond','Noto Serif SC',serif; font-weight:500;
    font-size:clamp(2.2rem,6vw,4.2rem); letter-spacing:.1em; }
  h1 small { display:block; font-size:.36em; letter-spacing:.5em; color:var(--tintLight); margin-top:.8rem; }
  .line { margin:2rem auto 0; max-width:30em; font-size:1rem; line-height:2.1; color:rgba(242,233,219,.72); }
  .soon { margin:3rem auto 0; font-size:.66rem; letter-spacing:.4em; color:var(--tint); text-transform:uppercase; }
  .actions { display:flex; gap:1rem; justify-content:center; flex-wrap:wrap; margin-top:3rem; }
  .actions a { padding:.9rem 2.2rem; text-decoration:none; font-size:.72rem; letter-spacing:.26em;
    text-transform:uppercase; transition:all .45s; }
  .back { border:1px solid rgba(242,233,219,.3); color:rgba(242,233,219,.75); }
  .back:hover { border-color:var(--tintLight); color:var(--tintLight); }
  .cta { border:1px solid var(--tint); color:var(--tintLight); }
  .cta:hover { background:var(--tint); color:var(--navy); box-shadow:0 0 40px color-mix(in srgb, var(--tint) 45%, transparent); }
  footer { position:relative; z-index:1; text-align:center; padding:1.6rem 4vw;
    border-top:1px solid rgba(197,168,106,.15); font-size:.6rem; letter-spacing:.24em;
    color:rgba(242,233,219,.4); text-transform:uppercase; }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="glow"></div>
<nav class="nav">
  <a class="logo" href="/zh/">THE INNER COSMOS</a>
  <a class="book" href="/zh/begin">Book a Session</a>
</nav>
<main>
  <p class="num">03</p>
  <h1>灵气疗愈宇宙<small>Energy</small></h1>
  <p class="line">疗愈身心，重启能量。疗愈、净化、平衡、重启——让身体与能量场回到自然的节奏。</p>
  <p class="soon">这个宇宙正在成形 · Coming Soon</p>
  <div class="actions">
    <a class="back" href="/zh/">← 返回宇宙地图</a>
    <a class="cta" href="/zh/begin">预约咨询</a>
  </div>
</main>
<footer>© 2026 THE INNER COSMOS · 宇宙一直在说话</footer>
<script>
(function () {
  var c = document.getElementById('sky'); if (!c) return;
  var x = c.getContext('2d'); var w, h, S = [];
  function rs() { w = c.width = innerWidth; h = c.height = innerHeight; S = [];
    for (var i = 0; i < Math.min(200, w * h / 9000); i++)
      S.push({ x: Math.random()*w, y: Math.random()*h, r: .3+Math.random()*1.1, p: Math.random()*6.28 });
  }
  rs(); addEventListener('resize', rs);
  var rm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function f(t) { x.clearRect(0,0,w,h);
    for (var i=0;i<S.length;i++) { var s=S[i];
      var a=.22+.5*Math.abs(Math.sin(t*.0005+s.p));
      x.beginPath(); x.fillStyle='rgba(242,233,219,'+a+')'; x.arc(s.x,s.y,s.r,0,6.28); x.fill(); }
    if (!rm) requestAnimationFrame(f); }
  requestAnimationFrame(f);
})();
</script>
</body>
</html>
